packages:
  - 'packages/*'
allowBuilds:
  # Ships a binding.gyp, so pnpm would run node-gyp on it -- which compiles
  # nothing, because the package already carries a prebuilt N-API binary that
  # Node and Electron both load (CLAUDE.md section 2), but still wants Python
  # and MSVC on a fresh machine. Refused, like electron-winstaller below.
  better-sqlite3: false
  electron: true
  # Squirrel.Windows, pulled in by electron-builder 26. This project targets
  # NSIS and portable only, so its postinstall would fetch a toolchain that
  # never gets used. A recorded decision, not an unanswered prompt.
  electron-winstaller: false
  esbuild: true

# Transitive security patches.
#
# Every entry here is a build-time, dev-time or test-time dependency several
# levels down, reachable only through the packaging, the dev server, the tests
# or the linter. None of them ship inside the application -- its runtime
# dependencies carry no advisories. They are pinned rather than waited on
# because the parents release on their own schedule and a lockfile that reports
# clean is worth more than one carrying findings nobody reads any more.
#
# Each is pinned inside its existing major, so no parent gets a version it did
# not ask for. Remove an entry once its parent has moved past it on its own.
overrides:
  # <3.3.18: a custom generator with size 0 spins forever.
  # Via postcss, from both tailwindcss and vite.
  nanoid@3: '^3.3.18'

  # <1.1.17: unbounded expansion length, OOM crash. The 1.x line arrives via
  # minimatch@3, which @electron/asar and eslint-plugin-react still depend on.
  # <1.1.21: then three more in the same family -- uncontrolled recursion on
  # nested groups and in parseCommaParts, and quadratic `{a},b}` rewriting.
  brace-expansion@1: '^1.1.21'

  # <2.1.4: the same unbounded-expansion family, separately advised against the
  # 2.x line. <2.1.7: the three advisories above, again for 2.x. Reaches us
  # through minimatch under electron-builder's @electron/universal.
  brace-expansion@2: '^2.1.7'

  # <3.1.8: inconsistent host case normalisation through percent-encoding.
  # <3.1.9: four more in URI parsing -- a percent-encoded scheme, WHATWG host
  # canonicalisation, a colon in a first segment, relative path equivalence
  # (GHSA-w74x-v6f9-j3xg, -wjr9-j795-jxcr, -333x-w4r6-6crp, -xhq7-xmqj-769h).
  # Via ajv, inside electron-builder's config validation and @elgato/cli's
  # manifest validation.
  fast-uri@3: '^3.1.9'

  # <4.3.1: quadratic CPU in !!omap resolution, CVE-2026-59870. Via
  # @eslint/eslintrc, so it leaves with the ESLint 9 migration.
  js-yaml@4: '^4.3.1'

  # 0.9.0 to 0.9.11: XML fragment injection through EntityReference.nodeName.
  # Via plist, inside app-builder-lib's macOS signing path -- code this project
  # never executes, since it only targets Windows. Pinned anyway: "we do not
  # call that path" is an argument that stops being true quietly.
  '@xmldom/xmldom@0.9': '^0.9.12'

  # <1.11.0: quote() lets a line terminator after a `{ comment }` token through
  # unescaped, GHSA-pqg4-j6r4-53mv. Via concurrently, which runs `pnpm dev`.
  shell-quote@1: '^1.11.0'

  # <1.2.2: indexed source maps with crafted section offsets stall the event
  # loop, GHSA-68fv-2mgg-jv7q. Via css-tree, under jsdom, under Vitest.
  source-map-js@1: '^1.2.2'

  # 6.x: quadratic parsing of flat selectors, GHSA-rj75-hqrm-r3gf, fixed only in
  # 7.1.6. Via tailwindcss 3 and its postcss-nested, which ask for ^6. The one
  # entry here that crosses a major, so it was checked rather than assumed: the
  # renderer's CSS built byte-identical on 6.1.4 and 7.1.6 (2026-10-15). Drop it
  # with the move to Tailwind 4, which does not use this parser.
  postcss-selector-parser@6: '^7.1.6'

  # 1.16.0: two ways for an authorization header to follow a cross-origin
  # redirect -- array-form headers, GHSA-q3jh-wrc6-jgq8, and an unescaped
  # sensitiveHeaders pattern, GHSA-8r9p-f939-6h3c. Via axios under wait-on,
  # which waits for the dev server in `pnpm dev`. <=1.16.1: a sensitiveHeaders
  # array from another realm is discarded, GHSA-mrwp-f3q8-3g9p.
  follow-redirects@1: '^1.16.2'

  # <18.3.1: quadratic split in string().email({ multiple: true }),
  # GHSA-4528-x5fx-h6hg. Via the same wait-on, validating its own options.
  joi@18: '^18.3.1'

  # Undici, one advisory family across three majors (2026-10-15 releases): TLS
  # options dropped in Agent, cross-origin redirects poisoning the cache, a TLS
  # 1.2 renegotiation, excessive content-encodings, the decompress interceptor,
  # PONG buffering, the EventSource parser and SRI algorithm case
  # (GHSA-2m5v-pch6-74hx, -4w7w-5xrc-9h26, -qrxm-fqhp-jwvm, -xjj6-f33q-929c,
  # -55wc-3pg8-jfw6, -9fm3-97px-rjf6, -4qv8-2p9j-2685, -f72v-6w45-q472).
  #  - 8.x: via jsdom, the renderer tests' DOM.
  #  - 7.x: via electron's @electron/get, which downloads Electron at install.
  #  - 6.x: via node-gyp under @electron/rebuild, which never runs here
  #    (`npmRebuild: false`, CLAUDE.md section 2).
  undici@8: '^8.12.2'
  undici@7: '^7.30.1'
  undici@6: '^6.29.1'

  # <4.6.6: oversized constrained collections exhaust memory while validating,
  # GHSA-mrhx-c7xc-m3w5. Via eslint-plugin-react-hooks, so only in `pnpm lint`.
  zod@4: '^4.6.6'

  # More advisories have no fixed release to pin, so they stay open on
  # purpose (2026-10-15). Each is reachable only at build time, unless said
  # otherwise, and none can be fed input from outside this repository:
  #  - braces <=3.0.3, GHSA-vfj7-8cjw-p6xm, deep nesting exhausts the stack. Via
  #    tailwindcss 3 (chokidar, micromatch), expanding our own content globs.
  #  - http-cache-semantics <=4.2.0, GHSA-ch52-4w7c-c8xp, max-stale serves one
  #    user's cached response to another. Via electron-builder's @electron/get,
  #    whose cache downloads Electron for one user on one machine. 4.3.0 does
  #    not change max-stale handling, though `pnpm audit` now calls it patched:
  #    re-checked by diffing the two releases (2026-10-22). The maintainer
  #    closed the report as not planned and the CVE is disputed.
  #  - sprintf-js <=1.1.3, GHSA-hp3w-g68c-fv3c, an unbounded precision throws.
  #    Via roarr, the logger inside the same @electron/get, which formats its
  #    own messages.
  #  - zod 3.x, GHSA-mrhx-c7xc-m3w5 above, fixed only in 4.6.6, whose API is
  #    not 3's (2026-11-02). Via @elgato/utils, still on ^3.25 in 0.6.2, and so
  #    inside the Stream Deck plugin's bundle -- the one entry here that ships.
  #    What it validates there comes from the Stream Deck app on the same
  #    machine. Drop it when @elgato/utils moves to zod 4.
  #  - minimatch <11.0.1, GHSA-g3hv-75wg-m249, globparts amplification.
  #    Fixed only in 11, released 2026-10-27, while eslint, electron-builder
  #    and their kin ask for 3, 5, 9 and 10: four majors forced across, for
  #    globs this repository writes itself (2026-11-02).
