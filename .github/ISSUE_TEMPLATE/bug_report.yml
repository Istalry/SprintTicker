name: Bug report
description: Something behaves differently from what the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security issues here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - A real BUSY Bar over USB
        - Mock hardware (pnpm dev:mock or --mock-hardware)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA you built from, or the installer version.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Windows version:
        - Node version (`node -v`):
        - pnpm version (`pnpm -v`):
        - Installed or built from source:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant output. Notification titles and bodies are redacted by default;
        please keep it that way unless the bug is in the notification pipeline
        itself, and even then redact anything you would not post publicly.
      render: text

  - type: checkboxes
    id: lfs
    attributes:
      label: If the display or animations look wrong
      options:
        - label: I cloned with Git LFS installed, and `Animations/` contains real PNGs rather than 130-byte pointer files.
