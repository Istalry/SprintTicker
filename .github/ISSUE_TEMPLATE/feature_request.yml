name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](../blob/main/ROADMAP.md) first — several obvious
        gaps are already there with the reason they are waiting, and a few
        things are listed under "Not planned".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution. What does the app make hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require a server, an account, or anything leaving the machine.
        - label: This works with one device and one user.
