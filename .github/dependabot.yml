version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per group, because a solo project cannot review ten dependency
      # PRs a month and the alternative is that none of them get reviewed.
      types:
        patterns: ['@types/*']
      eslint:
        patterns: ['eslint', 'eslint-*', '@typescript-eslint/*']
      react:
        patterns: ['react', 'react-dom', '@vitejs/plugin-react']
      vite:
        patterns: ['vite', 'vitest', '@vitest/*']
    ignore:
      # Rebuilt from source against Electron's ABI on every install; a major
      # here means a native rebuild on every developer machine, and it is
      # driven by the Electron upgrade rather than chosen independently.
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
      #
      # electron is deliberately NOT ignored, despite majors being genuine
      # migrations. It was, briefly, on the reasoning that a solo project
      # cannot absorb a Chromium bump every eight weeks. That reasoning
      # suppresses the single most important update this repository receives:
      # Electron ships inside the packaged app, so its advisories reach users,
      # and by the time anyone noticed, this project was fourteen majors behind
      # on a release that had been end-of-life for over a year -- roughly sixty
      # open alerts. A PR nobody merges for a month is still visible. A PR that
      # never opens is not.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
