name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - name: Install Dependencies & Approve Native Builds
        run: |
          pnpm install
          pnpm approve-builds --all

      - name: Run Pre-Flight Release Check
        run: pnpm preflight

      - name: Package Unity C# UPM Bundle
        run: pnpm package:unity

      - name: Compile Production Desktop Application
        run: pnpm package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            packages/desktop-app/dist-electron/*.exe
            packages/unity-plugin/package.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
