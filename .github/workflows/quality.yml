name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and typecheck need no native module and no LFS payload, so this job
  # installs with --ignore-scripts and skips the ~15 MB animation fetch.
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Cheap enough to gate on: pure file reads, no native module, no LFS. It
      # catches a version drift across the three package.json files at the
      # moment it is introduced rather than at the moment someone tries to cut a
      # release, which is when build-windows.yml would otherwise refuse the tag.
      # Its better-sqlite3 check reads the prebuild in the package tarball,
      # which --ignore-scripts above does not skip.
      - name: Pre-flight checks
        run: pnpm preflight

      # docs/index.html is generated from the three Markdown documents. This is
      # what stops the page and its sources drifting: a rule saying "remember to
      # rebuild" is forgettable, a failing job is not.
      - name: Documentation is up to date
        run: pnpm docs:check

      # The same arrangement for the pixel fonts: the glyph sheets are the
      # source, the TypeScript tables are generated from them, and a sheet
      # edited without regenerating would ship the old letters.
      - name: Generated fonts are up to date
        run: pnpm fonts:check

      # The animation studio's tests are pure TypeScript -- no native module,
      # no Python, no bar -- so they run here rather than on the slower
      # Windows runner, which they do not need.
      - name: Animation studio tests
        run: pnpm test:studio

  # Windows, because that is the only platform this app targets: the
  # notification listener drives PowerShell and several code paths are gated on
  # process.platform === 'win32'. Running these on ubuntu would measure a
  # different program and quietly skip the branches most likely to break.
  #
  # Separate from the packaging workflow, which needs LFS and this does not.
  # (It once also kept two better-sqlite3 rebuilds, one per ABI, from fighting
  # on one machine; since better-sqlite3 13 there is one N-API binary for both.)
  test:
    name: Test & coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # tests read Animations/ file names, meta.json and .anim -- none of them LFS

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Enforces the coverage floor configured in vitest.config.ts, which is
      # ratcheted up as the measurement rises. `pnpm test` alone would report
      # green below it. The figures are deliberately not repeated here: this
      # comment quoted 78/80/80/68 long after the floor had moved on.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/desktop-app/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Full history, so this sees what a rewrite has and has not removed.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
