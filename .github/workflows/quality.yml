name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and typecheck need no native module and no LFS payload, so this job
  # installs with --ignore-scripts and skips the ~15 MB animation fetch.
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Windows, because that is the only platform this app targets: the
  # notification listener drives PowerShell and several code paths are gated on
  # process.platform === 'win32'. Running these on ubuntu would measure a
  # different program and quietly skip the branches most likely to break.
  #
  # Separate runner from the packaging workflow on purpose. better-sqlite3 must
  # be built for the Node ABI here (pretest does it) and for the Electron ABI
  # there; on one machine those two rebuilds fight, and the loser fails with
  # NODE_MODULE_VERSION.
  test:
    name: Test & coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # no test reads Animations/

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Enforces the configured thresholds (80% statements/lines/functions,
      # 70% branches). `pnpm test` alone would report green below them.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/desktop-app/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Full history, so this sees what a rewrite has and has not removed.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
