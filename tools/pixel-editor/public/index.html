<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSY Bar 16×16 Pixel Art Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090D16;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #38BDF8;
      --accent-green: #10B981;
      --accent-purple: #8B5CF6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

    header { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #38BDF8, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
    .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34D399; padding: 4px 10px; borderRadius: 20px; }

    .app-layout { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    
    .panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .panel-title { font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    select, input[type="text"] { width: 100%; background: #1E293B; border: 1px solid var(--border-color); color: #FFF; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; margin-bottom: 16px; }
    select:focus { border-color: var(--accent-blue); }

    .tool-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .tool-btn { flex: 1; padding: 10px; background: #1E293B; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active { background: var(--accent-blue); color: #090D16; border-color: var(--accent-blue); font-weight: 600; }

    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .color-swatch { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; position: relative; }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { border-color: #FFF; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    .color-swatch.transparent-swatch { background: repeating-conic-gradient(#334155 0% 25%, #1E293B 0% 50%) 50% / 10px 10px; }

    .custom-color-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    input[type="color"] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; background: transparent; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 8px; }

    .action-btn { width: 100%; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #10B981, #059669); color: #FFF; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); margin-top: 10px; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary { background: #1E293B; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-secondary:hover { background: #334155; }

    /* Canvas Grid */
    .editor-center { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    .canvas-container { position: relative; width: 440px; height: 440px; background: #0F172A; border-radius: 16px; border: 1px solid var(--border-color); padding: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
    
    .grid-cell { width: 100%; height: 100%; border-radius: 2px; cursor: pointer; transition: background-color 0.05s; position: relative; background-color: #1E293B; }
    .grid-cell.cell-transparent { background: repeating-conic-gradient(#1E293B 0% 25%, #0F172A 0% 50%) 50% / 12px 12px; }
    .grid-cell:hover { outline: 2px solid var(--accent-blue); z-index: 10; }

    /* Live Preview Matrix */
    .preview-card { width: 100%; max-width: 1100px; margin-top: 24px; }
    .display-matrix-emulator { width: 100%; height: 80px; background: #000; border-radius: 12px; border: 2px solid #334155; padding: 8px; display: flex; align-items: center; justify-content: center; }
    .matrix-canvas-preview { background: #050811; border-radius: 6px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }

    .history-controls { display: flex; gap: 8px; width: 100%; margin-top: 10px; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #10B981; color: #FFF; padding: 12px 20px; border-radius: 10px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>🎨 BUSY Bar 16×16 Pixel Art Editor</h1>
    <div class="status-badge">Connected to pixel-bitmaps.ts</div>
  </header>

  <main class="app-layout">
    
    <!-- Left Sidebar: Controls & Palette -->
    <aside class="panel">
      <div class="panel-title">Active Icon Definition</div>
      <select id="iconSelect">
        <option value="SLACK_16X16_BITMAP">💬 Slack (16×16)</option>
        <option value="DISCORD_16X16_BITMAP">🎮 Discord Clyde (16×16)</option>
        <option value="GMAIL_16X16_BITMAP">✉️ Gmail Envelope (16×16)</option>
        <option value="CHECKMARK_16X16_BITMAP">✅ Active Task Checkmark (16×16)</option>
        <option value="UNITY_16X16_BITMAP">🕹️ Unity Cube (16×16)</option>
        <option value="BURGER_16X16_BITMAP">🍔 Lunch Burger (16×16)</option>
        <option value="CLOCK_16X16_BITMAP">⏰ Away Clock (16×16)</option>
        <option value="PAUSE_16X16_BITMAP">⏸️ Pause Task (16×16)</option>
        <option value="PLAY_16X16_BITMAP">▶️ Resume Task (16×16)</option>
        <option value="STOP_16X16_BITMAP">⏹️ Stop Task (16×16)</option>
        <option value="ERROR_16X16_BITMAP">⚠️ Unity Exception (16×16)</option>
        <option value="COMPILING_16X16_BITMAP">⚡ Unity Compiling (16×16)</option>
        <option value="PLAYMODE_16X16_BITMAP">🔴 Play Mode ON AIR (16×16)</option>
        <option value="WAVE_16X16_BITMAP">🌊 Great Wave (16×16)</option>
      </select>

      <div class="panel-title">Drawing Mode</div>
      <div class="tool-group">
        <button class="tool-btn active" id="toolPencil">✏️ Pencil</button>
        <button class="tool-btn" id="toolEraser">🧼 Eraser</button>
        <button class="tool-btn" id="toolPicker">🧪 Eyedropper</button>
      </div>

      <div class="panel-title">Color Palette</div>
      <div class="palette-grid" id="paletteGrid">
        <div class="color-swatch transparent-swatch active" data-color="null" title="Transparent (null)"></div>
        <div class="color-swatch" style="background:#36C5F0" data-color="#36C5F0" title="Slack Cyan"></div>
        <div class="color-swatch" style="background:#2EB67D" data-color="#2EB67D" title="Slack Green"></div>
        <div class="color-swatch" style="background:#E01E5A" data-color="#E01E5A" title="Slack Pink"></div>
        <div class="color-swatch" style="background:#ECB22E" data-color="#ECB22E" title="Slack Yellow"></div>
        <div class="color-swatch" style="background:#5865F2" data-color="#5865F2" title="Discord Blurple"></div>
        <div class="color-swatch" style="background:#EA4335" data-color="#EA4335" title="Gmail Red"></div>
        <div class="color-swatch" style="background:#4285F4" data-color="#4285F4" title="Gmail Blue"></div>
        <div class="color-swatch" style="background:#34A853" data-color="#34A853" title="Gmail Green"></div>
        <div class="color-swatch" style="background:#FBBC05" data-color="#FBBC05" title="Gmail Yellow"></div>
        <div class="color-swatch" style="background:#F59E0B" data-color="#F59E0B" title="Burger Bun"></div>
        <div class="color-swatch" style="background:#10B981" data-color="#10B981" title="Burger Lettuce"></div>
        <div class="color-swatch" style="background:#B45309" data-color="#B45309" title="Burger Patty"></div>
        <div class="color-swatch" style="background:#3B82F6" data-color="#3B82F6" title="Unity Blue"></div>
        <div class="color-swatch" style="background:#EF4444" data-color="#EF4444" title="Pause Red"></div>
        <div class="color-swatch" style="background:#FFFFFF" data-color="#FFFFFF" title="Pure White"></div>
        <div class="color-swatch" style="background:#0F172A" data-color="#0F172A" title="Dark Slate"></div>
        <div class="color-swatch" style="background:#000000" data-color="#000000" title="Pure Black"></div>
      </div>

      <div class="custom-color-container">
        <input type="color" id="customColorPicker" value="#38BDF8">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Custom Color Hex</span>
      </div>

      <div class="history-controls">
        <button class="tool-btn" id="btnUndo">↩️ Undo</button>
        <button class="tool-btn" id="btnRedo">↪️ Redo</button>
        <button class="tool-btn" id="btnClear">🗑️ Clear</button>
      </div>

      <button class="action-btn btn-primary" id="btnSave">
        💾 Save Bitmaps to Project
      </button>
    </aside>

    <!-- Center: Interactive 16x16 Canvas -->
    <section class="editor-center">
      <div class="panel" style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div class="panel-title" style="width: 100%;">
          <span>16×16 Matrix Grid Canvas</span>
          <span style="font-family: monospace; color: var(--accent-blue);" id="hoverCoords">X: 0, Y: 0</span>
        </div>
        <div class="canvas-container" id="gridCanvas"></div>
      </div>
    </section>

  </main>

  <!-- Bottom: Simulated Live BUSY Bar 72x16 Display Preview -->
  <section class="panel preview-card">
    <div class="panel-title">
      <span>🖥️ Live 72×16 BUSY Bar Hardware Display Preview</span>
      <span style="color: var(--accent-green);">100% 1:1 Pixel Match</span>
    </div>
    <div class="display-matrix-emulator">
      <canvas id="previewMatrixCanvas" width="576" height="128" class="matrix-canvas-preview"></canvas>
    </div>
  </section>

  <div class="toast" id="toast">Changes saved to pixel-bitmaps.ts!</div>

  <script src="app.js"></script>
</body>
</html>
